<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Poetry Garden</title>
    <style>
        body {
            background-color: #fcf9f2; /* Soft, warm background */
            color: #333;
            font-family: 'Georgia', serif;
            text-align: center;
            padding: 50px 20px;
        }
        .hero {
            margin-bottom: 50px;
        }
        h1 {
            font-size: 2.5rem;
            color: #5c3a21;
        }
        .poem-card {
            background: white;
            border: 1px solid #eadbc8;
            border-radius: 10px;
            padding: 30px;
            max-width: 600px;
            margin: 0 auto 30px auto;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .footer {
            margin-top: 50px;
            font-size: 0.9rem;
            color: #777;
        }
    </style>
</head>
<body>

    <div class="hero">
        <div>🌹🌹🌹</div>
        <h1>Echoes of the Soul</h1>
        <p>A garden where every feeling becomes a poem.</p>
    </div>

    <div class="poem-card">
        <h2>The First Leaf</h2>
        <p>
            The wind blows soft,<br>
            The leaves fall light,<br>
            A quiet thought,<br>
            In the fading night.
        </p>
    </div>

    <div class="footer">
        ✦ Made by [Rahul Mandal] ✦
    </div>

</body>
</html>
